<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远程访问 · 交互设计预览</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23366bdb'/%3E%3Crect x='6' y='7' width='20' height='14' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 21v5m-5 0h10' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --canvas:#17191d; --panel:#272a30; --surface:#30343b; --hover:#383d46; --line:#414650; --text:#f1f3f7; --muted:#b2b8c4; --quiet:#969eae; --accent:#9bbbff; --primary:#366bdb; --green:#82d4ac; --red:#ffa6a6; --amber:#e7c287; --select:#324363; }
    [data-theme="light"] { color-scheme:light; --canvas:#e9ecf1; --panel:#fff; --surface:#f4f5f8; --hover:#e9edf4; --line:#d9dde5; --text:#252a34; --muted:#596373; --quiet:#626d7e; --accent:#2858b5; --primary:#3467d2; --green:#22744e; --red:#b12c39; --amber:#835d1b; --select:#edf3ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,select,input { font:inherit; }
    button { cursor:pointer; }
    button,select { color:var(--text); }
    button:disabled { cursor:default; opacity:.55; }
    button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    ::selection { background:var(--select); color:var(--text); }
    :root { scrollbar-color:var(--line) var(--canvas); }
    svg.icon { width:18px; height:18px; stroke:currentColor; stroke-width:1.6; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .symbols { position:absolute; width:0; height:0; overflow:hidden; }
    .preview { max-width:1120px; margin:auto; padding:28px 32px 24px; }
    .preview-heading { display:flex; align-items:center; gap:12px; padding-bottom:24px; }
    .preview-heading h1 { font-size:18px; font-weight:600; margin:0; }
    .preview-heading p { margin:2px 0 0; font-size:12px; color:var(--quiet); }
    .preview-mark { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--line); border-radius:8px; color:var(--accent); }
    .theme-button { margin-left:auto; }
    .preview-controls { display:flex; flex-wrap:wrap; align-items:center; gap:16px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .preview-controls label { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
    select { border:1px solid var(--line); background:var(--panel); padding:6px 30px 6px 10px; border-radius:6px; }
    .demo-label { margin-left:auto; color:var(--quiet); font-size:12px; }
    .stage { min-height:670px; display:flex; justify-content:center; align-items:flex-start; padding:38px 0 26px; }
    .panel { width:440px; max-width:100%; padding:23px 24px 18px; border:1px solid var(--line); background:var(--panel); border-radius:12px; }
    .stage.narrow .panel { width:350px; }
    .panel-header { display:flex; align-items:center; gap:10px; min-height:32px; margin-bottom:24px; }
    h2 { margin:0; font-size:18px; font-weight:600; line-height:1.5; }
    h3 { margin:0 0 8px; font-size:18px; font-weight:600; line-height:1.5; }
    p { margin:0; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; padding:0; background:transparent; border:0; border-radius:5px; color:var(--muted); }
    .icon-button:hover { background:var(--hover); color:var(--text); }
    .close { margin-left:auto; }
    .status { display:inline-flex; align-items:center; gap:6px; color:var(--green); font-size:12px; white-space:nowrap; }
    .status::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .status.off { color:var(--muted); }
    .status.warning { color:var(--amber); }
    .project { display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:500; }
    .project svg { color:var(--muted); }
    .muted { color:var(--muted); font-size:13px; line-height:1.7; }
    .center { text-align:center; }
    .home-note { margin:6px 0 0; }
    .qr-wrap { width:202px; height:202px; background:#fff; border-radius:8px; margin:23px auto 16px; padding:4px; }
    .qr-wrap img { display:block; width:100%; height:100%; }
    .scan-label { margin-bottom:20px; font-size:12px; color:var(--muted); }
    .actions { display:flex; gap:10px; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:38px; padding:8px 13px; border:1px solid var(--line); border-radius:6px; background:transparent; font-size:13px; line-height:1.5; text-decoration:none; }
    .button:hover:not(:disabled) { background:var(--hover); }
    .button.primary { border-color:var(--primary); background:var(--primary); color:#fff; }
    .button.primary:hover:not(:disabled) { filter:brightness(1.1); }
    .actions .button { flex:1; }
    .wide { width:100%; }
    .link-preview { font-size:11px; color:var(--quiet); text-align:center; margin-top:10px; overflow-wrap:anywhere; }
    .panel-footer { display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid var(--line); padding-top:15px; margin-top:25px; }
    .panel-footer p { font-size:12px; color:var(--muted); }
    .text-button { background:transparent; border:0; color:var(--accent); padding:3px 0; font-size:13px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
    .text-button:hover { text-decoration:underline; }
    .text-button svg { width:15px; height:15px; }
    .setting-row { display:flex; align-items:center; gap:14px; padding:17px 0; border-bottom:1px solid var(--line); }
    .setting-row:first-child { padding-top:0; }
    .setting-body { flex:1; min-width:0; }
    .setting-label { font-size:13px; font-weight:500; }
    .setting-value { color:var(--muted); font-size:12px; margin-top:4px; overflow-wrap:anywhere; }
    .version { font-variant-numeric:tabular-nums; }
    .release-info { margin-top:8px; font-size:12px; color:var(--accent); }
    .version-row { flex-wrap:wrap; }
    .update-note { flex-basis:100%; font-size:12px; color:var(--muted); margin-top:-4px; }
    .row-link { width:100%; background:none; border:0; border-bottom:1px solid var(--line); padding:18px 0; display:flex; align-items:center; justify-content:space-between; font-size:13px; }
    .row-link:hover { color:var(--accent); }
    .row-link span { display:flex; align-items:center; gap:10px; }
    .row-link > svg { width:15px; color:var(--quiet); }
    .support { margin-top:22px; color:var(--muted); font-size:12px; }
    summary { cursor:pointer; width:fit-content; padding:3px 0; }
    summary:hover { color:var(--text); }
    .support-content { padding:12px 0 0; }
    .support-content p { margin-bottom:10px; }
    .support-content .text-button + .text-button { margin-left:20px; }
    .danger { color:var(--red); }
    .setting-foot { margin-top:24px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .setting-foot small { color:var(--quiet); font-size:11px; }
    .intro { padding:10px 0 6px; }
    .intro > .muted { margin:8px 0 25px; }
    .message-icon { width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; margin-bottom:18px; color:var(--accent); }
    .message-icon.success { color:var(--green); }
    .message-icon.warning { color:var(--amber); }
    .message-icon svg { width:22px; height:22px; }
    .flow-actions { margin-top:24px; }
    .flow-actions .text-button { display:flex; margin:12px auto 0; }
    .detail { margin-top:20px; font-size:12px; color:var(--muted); }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:10px 0 0; padding:12px; background:var(--surface); border-radius:6px; font:11px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; }
    fieldset { padding:0; margin:0; border:0; min-width:0; }
    legend { font-size:18px; font-weight:600; margin-bottom:6px; padding:0; }
    .choices { margin-top:23px; display:grid; gap:12px; }
    .choice { display:flex; align-items:flex-start; gap:12px; padding:16px 13px; border:1px solid var(--line); border-radius:7px; cursor:pointer; }
    .choice:has(input:checked) { border-color:var(--accent); background:var(--select); }
    .choice input { margin:4px 0 0; width:15px; height:15px; accent-color:var(--primary); flex-shrink:0; }
    .choice strong { display:block; font-size:13px; font-weight:500; }
    .choice small { display:block; color:var(--muted); font-size:12px; margin-top:5px; line-height:1.7; }
    .progress { height:5px; width:100%; background:var(--surface); border-radius:3px; margin:24px 0 10px; overflow:hidden; }
    .progress span { display:block; height:100%; background:var(--primary); border-radius:3px; transition:width .3s ease-out; }
    .progress-note { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    .project-row { display:flex; align-items:center; gap:12px; width:100%; padding:17px 0; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; }
    .project-row:hover { color:var(--accent); }
    .project-row > span { flex:1; }
    .project-row small { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
    .project-row > svg:last-child { width:15px; color:var(--quiet); }
    .closed { text-align:center; padding:70px 20px; color:var(--muted); }
    .closed p { margin-bottom:18px; }
    .preview-note { text-align:center; color:var(--quiet); font-size:12px; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translate(-50%,12px); max-width:calc(100vw - 32px); padding:10px 16px; border:1px solid var(--line); border-radius:7px; background:var(--panel); font-size:13px; opacity:0; visibility:hidden; transition:opacity .15s,transform .15s; z-index:5; }
    .toast.visible { transform:translate(-50%,0); opacity:1; visibility:visible; }
    [hidden] { display:none !important; }
    @media (max-width:600px) { .preview { padding:18px 16px; } .preview-heading { padding-bottom:18px; } .preview-controls { gap:10px 16px; } .demo-label { margin-left:0; flex-basis:100%; } .stage { min-height:0; padding:25px 0; } .panel { padding:20px 20px 17px; } .preview-controls label { gap:7px; } select { max-width:145px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; } }
  </style>
</head>

<main class="preview">
  <header class="preview-heading">
    <span class="preview-mark"><svg class="icon" aria-hidden="true"><use href="#i-monitor"/></svg></span>
    <div><h1>远程访问</h1><p>交互设计预览</p></div>
    <button class="icon-button theme-button" id="theme" aria-label="切换为浅色"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button>
  </header>
  <aside class="preview-controls" aria-label="预览控制">
    <label>场景<select id="scenario"><option value="home">已连接 · 日常使用</option><option value="setup">首次使用</option><option value="settings">设置与更新</option><option value="stopped">服务未启动</option><option value="failure">启动失败</option><option value="offline">网络连接中断</option><option value="paused">已暂停访问</option></select></label>
    <label>宽度<select id="width"><option value="normal">常规</option><option value="narrow">窄屏</option></select></label>
    <span class="demo-label">示例数据 · 安装、登录、更新均为演示</span>

  <div class="stage" id="stage"><section class="panel" id="panel" role="region" aria-label="远程访问面板"></section></div>
  <p class="preview-note">点击面板内的按钮体验流程，也可以从上方直接切换场景。</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    state.view = 'progress'; render();
    later(850, () => { state.progress=66; state.step=job==='install'?'正在校验并安装':'正在检查连接'; render();
      later(850, () => { state.progress=100; state.step='已完成'; render();
        later(350, () => { if(job==='install') { state.installed=true; visit('restart'); } else { state.connected=true; state.failed=false; visit('home'); } });
      });
    });
  }
  panel.addEventListener('change', event => {
    if (event.target.name === 'mode') { state.selected = event.target.value; render(); panel.querySelector(`input[value="${state.selected}"]`).focus(); }
  });
  panel.addEventListener('click', async event => {
    const target = event.target.closest('button');
    if (!target || target.disabled) return;
    if (target.dataset.project !== undefined) { state.project=Number(target.dataset.project); visit(state.accessView); return; }
    switch (target.dataset.action) {
      case 'home': visit('home'); break;
      case 'settings': visit('settings'); if (state.mode==='standalone') checkUpdate(); break;
      case 'close': lastView=state.view; visit('closed'); break;
      case 'reopen': visit(lastView); if(lastView==='settings'&&state.mode==='standalone') checkUpdate(); break;
      case 'return-access': visit(state.accessView); break;
      case 'open': visit('browser'); break;
      case 'copy': try { await navigator.clipboard.writeText(links[state.project]); showToast('示例链接已复制'); } catch { showToast('复制失败，请选中下方链接复制'); } break;
      case 'mode': state.selected=state.mode; visit('setup'); break;
      case 'choose': if(state.selected==='standalone'&&!state.installed) runJob('install'); else if(state.first) { state.mode=state.selected; visit('connect'); } else visit('switch-restart'); break;
      case 'restart': state.mode=state.selected; state.first=false; state.connected=false; visit('connect'); showToast('演示：IDEA 已重启，继续远程设置'); break;
      case 'login': visit('login'); break;
      case 'login-done': state.first=false; state.connected=true; visit('home'); showToast('演示：登录成功，远程访问已连接'); break;
      case 'start': case 'reconnect': case 'restart-service': runJob('start'); break;
      case 'stop-service': state.failed=false; state.connected=false; visit('stopped'); break;
      case 'pause': state.connected=false; visit('paused'); break;
      case 'resume': state.connected=true; visit('home'); break;
      case 'paused': visit('paused'); break;
      case 'projects': visit('projects'); break;
      case 'check-update': checkUpdate(); break;
      case 'update': state.update='updating'; state.progress=20; state.step='正在下载新版后台…'; render();
        later(850, () => { state.progress=70; state.step='正在校验并安装…'; render();
          later(1000, () => { state.version=latestVersion; state.update='latest'; render(); showToast('演示：后台已更新，IDEA 重启后回到此处'); });
        }); break;
    }
  });
  document.querySelector('#scenario').addEventListener('change', event => {
    clearTimeout(timer); clearTimeout(toastTimer); document.querySelector('#toast').classList.remove('visible');
    state=initial(); state.view=event.target.value;
    if(state.view==='setup') Object.assign(state,{mode:'embedded',selected:'embedded',installed:false,first:true,connected:false});
    if(state.view==='failure') Object.assign(state,{view:'stopped',failed:true});
    if(['stopped','offline','paused'].includes(state.view)) { state.connected=false; state.accessView=state.view; }
    if(state.view==='setup') state.accessView='connect';
    render(); if(state.view==='settings') checkUpdate();
  });
  document.querySelector('#width').addEventListener('change', event => document.querySelector('#stage').classList.toggle('narrow', event.target.value==='narrow'));
  document.querySelector('#theme').addEventListener('click', event => {
    const dark = document.documentElement.dataset.theme==='dark';
    document.documentElement.dataset.theme=dark?'light':'dark';
    const control=event.currentTarget; control.innerHTML=icon(dark?'moon':'sun'); control.setAttribute('aria-label',dark?'切换为深色':'切换为浅色');
  });
  render();
</script>
</body>
</html>

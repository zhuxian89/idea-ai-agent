<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Local AI Agent · iPhone 设计稿</title>
  <style>
    :root {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #1c2b24;
      background: #f4f6ef;
      --ink: #1c2b24;
      --muted: #52675a;
      --pine: #215641;
      --paper: #fcfdf9;
      --line: #d6e0d4;
      --blue: #81b4ff;
      --phone-dark: #0b1222;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    a { color: var(--pine); text-underline-offset: 4px; }
    h1, h2, h3, p { margin: 0; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #4e927b; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .icon-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon {
      width: 20px; height: 20px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .page { width: min(1216px, calc(100% - 80px)); margin-inline: auto; }
    .masthead { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); background: #f4f6ef; }
    .masthead-inner { min-height: 69px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 14px; color: var(--ink); text-decoration: none; }
    .app-mark {
      display: inline-block; flex: none; width: 28px; height: 28px; border-radius: 7px;
      background: #111a2d url("data:image/webp;base64,UklGRnQEAABXRUJQVlA4WAoAAAAQAAAAPwAAPwAAQUxQSKkAAAABYFNbW5s/RUAYYwVDiEjRVJ0wMbIjgC29vjnnRATDtm3DSO22E6ydIBdmuu1cnF8bXdfqTB6oKj9/qK/UHakJ88cGk15STDPgVFxQ2hnRludvO0Pa42c6zZhTumNmUCMiKpAEJVLPqLXknsXneobVLU3b0XSOxkWaOP/+jfjldxO/2/jdyO/WjN7NGb7b+W7Au4XvJrzb8G7EuxXvZrzbH5h/+d8gl7MCAFZQOCCkAwAAsBMAnQEqQABAAD6RPphJpaMiISgLULASCWcAyC4gDo/5D++Nx6f8XnOf8XvMWR+8i/gPQDuO+LKjj/VL10/+HyxfRX/d9wr9Wv+J2NPRL/aoxj+fUhH9GcALu74aZ00SAH8efDjIlQGrKrYFsVIt6DXMpTir9PW+195ON+YLd1nz9gTwC4uipXAIbuFBMOnkSfBRuOC6nllH4hbsn0vcn/hsEv0sAAD+/hTYAFmcADMXaCbppk1JtWqWSagvFl4rqfr7gApGDKG6KXF//BrlU9J2/vcDB9YRTQZoWVn4m02hCt9r3quoLZxHAr605+FfDaffW8cI6BZb0AVxrzzZTaTvG/XrIj+hDAsi1Yy7kQRcPsxx/ma9eE+YRN/JpEP6MVrlj8X3SkPD/qJlfYDXF+1cpDEPuQC3tyALYKxUg7vS+SVHAXVDDOCGurAVlnc1kwmRHf+4npT36MyHelL/i+bhtoSNSEdDlFgw0N5Z2Y8J0qF7OK2yex5Xoa6XJMrnqhSgBJmq+//hrUdlal19yV+oxihwRbdyh1/3vSxMer8QQh1nF6l3zPadhWJZj8rTzg8BkpYq1CY5KoCHfuCU7lDcPI0cp/ZjjiMvkWKzoPWD3k3GhKcUQUNbUDXxjZN+K2/pqcki8EWy+KX/fudP78V0faScPnfoarYDS2AkUHT5m71tPn31cqxNXeVQge9Gz/lc5R7KnvHw/44yLROxH4cNjVvS0PnIsjjmPe9vDhbS9+n/D1VlN5VowcZBt+o4bzD/0lyvb5EP+fSV1h77kgAEWoVrQUb2Q7ah1v7en0QPPWOroaIIHkwU+vZfQaSg7Soyb4sMyBPbkMWtnLJSe3rXAtg/kC0te0tubQ04Nk791XESllnCMqi+Wu3DkxLWgi9qH4m65QKg7wO+vFxqo1ZkcY75htQkXcCQdGA1tyDMtDqvgpEtA6J6Ef4+jcXr3v6p+XYyW4SBiQlyE0/nG6FeT6NYAo/ywSsuoKr2exDQaZzSWlVi6r9V4Y9OFGD0bFavHOqPSG4vv67cNGt8/S5mmwQBrohAKqcSGf5gTau/incv1PrjcLbZ9GSdKmV5K7v46MiAGKLgc//d40uokYrkbprKVqsCacTaZoj6h86sK3iThpTStZ/dw4/qK/6+fmLMVK8HwnUXRiljK4AsxAcsLczohm/v+5dsZYw3ZRHxeMmvjMATHpCYrOUZ3zwjI8XQG8WRgAC4dQDhWNvIiTngAAA=") center / cover no-repeat;

    .doc-nav { display: flex; gap: 26px; }
    .doc-nav a { font-size: 13px; color: var(--muted); text-decoration: none; }
    .doc-nav a:hover { color: var(--pine); text-decoration: underline; }

.gallery {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 44px 34px; padding-block: 27px 52px;
}
.preview { min-width: 0; margin: 0; scroll-margin-top: 90px; }
.preview figcaption {
  margin-bottom: 12px; text-align: center; font-size: 14px; font-weight: 680; color: var(--ink);
}

    .phone {
      position: relative; isolation: isolate;
      display: grid; grid-template-rows: 43px minmax(0, 1fr) 23px;
      width: 100%; max-width: 328px; height: 660px; margin-inline: auto;
      overflow: hidden; border: 7px solid #171d1b; border-radius: 49px;
      box-shadow: 0 24px 52px -22px #1e392c80;
      color: #eef3ff; background: var(--phone-dark);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .phone[data-tone="light"] { color: #1c3228; background: #eef3ec; }
    .phone[data-tone="lock"] {
      color: white;
      background: linear-gradient(151deg, #102a29 3%, #254838 40%, #3c665a 67%, #152d39 100%);
    }
    .phone-status {
      position: relative; display: flex; align-items: center; justify-content: space-between;
      padding: 5px 22px 0; font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums;
    }
    .island { position: absolute; top: 9px; left: 50%; translate: -50%; width: 91px; height: 25px; background: #111714; border-radius: 999px; }
    .status-right { display: flex; align-items: center; gap: 4px; }
    .status-right .icon { width: 14px; height: 14px; stroke-width: 1.8; }
    .battery { width: 18px; height: 9px; border: 1px solid currentColor; border-radius: 3px; padding: 1px; }
    .battery::before { content: ""; display: block; height: 100%; width: 84%; border-radius: 1px; background: currentColor; }
    .phone-home { display: grid; place-items: center; }
    .phone-home::before { content: ""; display: block; width: 106px; height: 4px; border-radius: 99px; background: currentColor; opacity: .88; }
    .phone-body { min-height: 0; position: relative; }
    .screen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .screen-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
    .screen-title { font-size: 26px; font-weight: 680; letter-spacing: -.026em; }
    .phone button, .phone a { touch-action: manipulation; }
    .phone button:focus-visible, .phone input:focus-visible { outline-offset: -3px; }
    .phone-button {
      display: grid; place-items: center; flex: none; min-width: 44px; min-height: 44px;
      background: transparent; color: inherit; border: 0; border-radius: 9px;
    }
    .phone-button:hover { background: #839a8924; }
    .nav-light, .nav-dark { display: flex; align-items: center; gap: 3px; min-height: 49px; padding-inline: 7px; }
    .nav-light { color: #285f47; }
    .nav-dark { color: var(--blue); border-block-end: 1px solid #273344; }
    .nav-text { display: inline-flex; gap: 4px; align-items: center; min-height: 44px; border: 0; background: transparent; color: inherit; font-size: 14px; border-radius: 9px; padding: 0 8px; }
    .nav-text:hover { background: #839a8924; }
    .nav-text .icon { width: 15px; height: 15px; }
    .nav-label { flex: 1; color: #f0f4ff; text-align: center; font-size: 14px; font-weight: 650; }
    .nav-spacer { width: 56px; flex: none; }

    .lock-screen { padding: 17px 13px 36px; justify-content: space-between; }
    .lock-clock { text-align: center; }
    .lock-clock > .icon { margin-bottom: 13px; }
    .lock-date { font-size: 14px; font-weight: 650; letter-spacing: .01em; }
    .lock-time { font-size: clamp(54px, 7vw, 76px); font-weight: 630; line-height: 1.06; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .notification {
      display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: start; gap: 9px;
      width: 100%; padding: 12px 11px; border: 0; border-radius: 19px;
      text-align: left; color: #15231e; background: #e5eee1;
    }
    .notification:hover { background: #eff5ec; }

    .notification-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: #43574b; font-size: 11px; }
    .notification-head span:last-child { white-space: nowrap; }
    .notification-title { display: block; margin-top: 3px; font-size: 12px; font-weight: 750; line-height: 1.42; overflow-wrap: anywhere; }
    .notification-summary { display: block; margin-top: 3px; font-size: 12px; color: #2b4135; line-height: 1.45; }

    .nodes-top { padding: 12px 18px 15px; }
    .nodes-top p { margin-top: 6px; font-size: 12px; color: #53695c; }
    .node-list { margin: 0 13px; overflow: hidden; border-radius: 15px; background: #fbfdf9; }
    .node {
      display: grid; grid-template-columns: 35px minmax(0, 1fr) 13px; align-items: center; gap: 9px;
      width: 100%; min-height: 69px; padding: 9px 10px; border: 0;
      color: #1f392d; background: transparent; text-align: left;
    }
    .node:hover { background: #e9f2e8; }
    .node + .node { border-top: 1px solid #dbe6dc; }
    .node-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: #31634d; background: #e2ece2; }
    .node-icon .icon { width: 17px; height: 17px; }
    .node > .icon { width: 13px; height: 13px; color: #5e7667; }
    .node strong, .node small { display: block; }
    .node strong { font-size: 13px; }
    .node small { margin-top: 3px; color: #526b5c; font-size: 11px; }
    .node small::before { content: ""; display: inline-block; vertical-align: 2px; width: 5px; height: 5px; margin-right: 5px; border-radius: 50%; background: #86928a; }
    .node[data-status="online"] small::before { background: #39845e; }
    .inline-status { margin-inline-start: 7px; color: #526b5c; font-size: 11px; }

    .minimal-page { padding: 16px 17px; }
    .minimal-page p { margin-top: 7px; color: #526b5c; font-size: 13px; line-height: 1.65; }
    .login-form { display: grid; gap: 10px; margin-top: 19px; }
    .login-form label { display: grid; gap: 5px; font-size: 12px; font-weight: 650; }
    .login-form input { min-width: 0; min-height: 43px; padding: 8px 10px; border: 1px solid #ccdace; border-radius: 8px; background: #fcfdf9; color: #2a4737; }
    .phone-primary {
      width: 100%; min-height: 44px; padding: 8px 11px; border: 0; border-radius: 9px;
      font-size: 13px; font-weight: 680; color: white; background: #275a43;
    }
    .phone-primary:hover { background: #1e4b37; }
    .minimal-page > .phone-primary { margin-top: 18px; }

    .chat-title { flex: 1; min-width: 0; min-height: 44px; text-align: left; color: #eff3ff; background: transparent; border: 0; border-radius: 7px; padding: 4px 3px; }
    .chat-title:hover { background: #25354a; }
    .chat-title small, .chat-title strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .chat-title small { margin-bottom: 3px; font-size: 11px; color: #a4b4cd; }
    .chat-title strong { font-size: 14px; }
    .chat-thread { padding: 12px 11px; }
    .time-divider { margin-bottom: 12px; text-align: center; font-size: 11px; color: #a4b4cd; }
    .user-bubble {
      width: fit-content; max-width: 87%; margin: 0 0 16px auto; padding: 8px 11px;
      border-radius: 13px 13px 4px 13px; background: #26334b; color: #f0f4ff; font-size: 13px; line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .agent-message { font-size: 13px; line-height: 1.65; color: #f0f4ff; padding-inline: 2px; }
    .agent-name { display: block; margin-bottom: 5px; color: #9db1cb; font-size: 11px; font-weight: 650; }
    .approval { margin: 12px 1px 11px; padding: 10px; border: 1px solid #485d7f; background: #1b263a; border-radius: 10px; }
    .approval strong { font-size: 13px; }
    .approval p { margin-top: 4px; font-size: 11px; line-height: 1.5; color: #c1cfe4; }
    .approval-actions { display: grid; grid-template-columns: 1.35fr 1fr; gap: 6px; margin-top: 8px; }
    .approval-actions button { min-height: 44px; padding: 5px 8px; border: 1px solid #4b617f; border-radius: 7px; color: #d9e7fe; background: transparent; font-size: 12px; font-weight: 680; }
    .approval-actions button:first-child { background: #a9cbff; border-color: #a9cbff; color: #172e4f; }
    .approval-actions button:hover { filter: brightness(1.13); }
    .approval-result { margin: 8px 2px; font-size: 12px; color: #c4d8ed; }
    .composer { display: grid; gap: 6px; padding: 6px 9px 2px; }
    .activity { font-size: 11px; color: #aebfda; }
    .activity::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 5px 1px 1px; border-radius: 50%; background: #81b4ff; }
    .input-row {
      display: grid; grid-template-columns: 39px minmax(0, 1fr) 39px; align-items: center;
      min-height: 43px; border: 1px solid #31405a; border-radius: 11px; background: #172137;
    }
    .input-row input { min-width: 0; width: 100%; padding: 5px 0; background: transparent; border: 0; color: #fff; font-size: 12px; }
    .input-row input::placeholder { color: #a4b4cd; }
    .input-row .phone-button { min-width: 39px; min-height: 41px; color: var(--blue); }
    .input-row .phone-button:disabled { color: #8193ad; }
    .input-row .icon { width: 17px; height: 17px; }
    .attachment { display: inline-flex; align-items: center; width: fit-content; gap: 6px; padding: 5px 7px; border-radius: 7px; color: #d0dff4; background: #26334b; font-size: 11px; }
    .attachment button { display: grid; place-items: center; width: 25px; height: 25px; border: 0; border-radius: 5px; background: transparent; color: inherit; }
    .attachment .icon { width: 15px; height: 15px; }
    .dark-list { padding: 13px 10px; }
    .dark-list-row { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 54px; padding: 8px 10px; border: 1px solid #2d3a50; border-radius: 10px; background: #182237; color: #edf3ff; text-align: left; font-size: 13px; }
    .dark-list-row + .dark-list-row { margin-top: 7px; }
    .dark-list-row:hover { background: #223149; }
    .dark-list-row > .icon:first-child { color: var(--blue); }
    .dark-list-row > .icon:last-child { width: 15px; height: 15px; margin-left: auto; color: #afc2dc; }
    .dark-list-row small { display: block; margin-top: 3px; font-size: 11px; color: #b0c0d8; }

    .sheet-shade { position: absolute; inset: 0; z-index: 3; display: flex; align-items: end; padding: 8px; }
    .sheet-backdrop { position: absolute; inset: 0; width: 100%; background: #02071399; border: 0; }
    .sheet { position: relative; z-index: 1; width: 100%; padding: 9px; border-radius: 19px 19px 15px 15px; color: #1d2b24; background: #f2f6ef; }
    .sheet h3 { margin: 7px 5px 8px; font-size: 14px; }
    .sheet button { display: flex; align-items: center; gap: 9px; min-height: 44px; width: 100%; padding: 8px 10px; color: #284b3a; background: #fcfdf9; border: 0; border-radius: 9px; text-align: left; font-size: 13px; }
    .sheet button + button { margin-top: 4px; }

.phone[data-tone="light-theme"] { --app-list: #f5f7fa; --app-group: #fff; --app-ink: #132339; --app-muted: #455a70; --app-rule: #cdd6e2; --app-accent: #1e5794; }
.phone[data-tone="meadow"] { --app-list: #f2edde; --app-group: #fcf8ed; --app-ink: #332b21; --app-muted: #685544; --app-rule: #ddd1bc; --app-accent: #775a27; }
.phone[data-tone="moss"] { --app-list: #e5ebdf; --app-group: #f4f8ef; --app-ink: #26392b; --app-muted: #485e4a; --app-rule: #c9d8c7; --app-accent: #235f44; }
.phone {
  --app-list: #151e31; --app-group: #0b1324; --app-ink: #edf3ff;
  --app-muted: #adbed6; --app-rule: #2b3950; --app-accent: #81b4ff;
}
.phone[data-tone="light-theme"], .phone[data-tone="meadow"], .phone[data-tone="moss"] { color: var(--app-ink); background: var(--app-list); }
.settings-view, .list-view { background: var(--app-list); color: var(--app-ink); }
.list-view .nav-dark, .settings-view .nav-dark { color: var(--app-accent); border-color: var(--app-rule); }
.list-view .nav-label, .settings-view .nav-label { color: var(--app-ink); }
.list-view .dark-list-row {
  border-color: var(--app-rule); background: var(--app-group); color: var(--app-ink);
}
.list-view .dark-list-row small { color: var(--app-muted); }
.list-view .dark-list-row .icon { color: var(--app-accent); }
.list-view .dark-list-row:hover { outline: 1px solid var(--app-accent); }
.list-view .dark-list-row > span { min-width: 0; overflow-wrap: anywhere; }
.phone-tabs {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  min-height: 50px; flex: none; background: var(--app-list); border-top: 1px solid var(--app-rule);
}
.phone-tabs button {
  display: grid; justify-items: center; align-content: center; gap: 3px;
  border: 0; color: var(--app-muted); background: transparent; font-size: 11px;
}
.phone-tabs button[aria-current="page"] { color: var(--app-accent); font-weight: 700; }
.phone-tabs .icon { width: 18px; height: 18px; }
.settings-body { padding: 12px 12px 16px; }
.settings-body > h2 { margin: 0 1px 11px; }
.settings-group + .settings-group { margin-top: 13px; }
.settings-group h3 { margin: 0 0 5px 3px; font-size: 11px; font-weight: 650; color: var(--app-muted); }
.settings-rows { overflow: hidden; border-radius: 10px; background: var(--app-group); }
.setting {
  display: flex; align-items: center; gap: 8px; min-height: 41px; width: 100%;
  padding: 6px 10px; text-align: left; font-size: 12px; color: var(--app-ink); background: transparent; border: 0;
}
.setting + *, .settings-rows > * + .setting { border-top: 1px solid var(--app-rule); }
button.setting:hover { background: #7592b41c; }
.setting-label { flex: 1; min-width: 0; }
.setting-meta { color: var(--app-muted); font-size: 11px; white-space: nowrap; }
.setting .icon { width: 14px; height: 14px; color: var(--app-accent); }
.setting-switch {
  position: relative; flex: none; width: 31px; height: 18px; border-radius: 10px; background: #51637b;
}
.setting-switch::before {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: white;
}
[aria-checked="true"] .setting-switch { background: #2d795a; }
[aria-checked="true"] .setting-switch::before { left: 15px; }
.choices { display: grid; grid-template-columns: repeat(var(--columns, 3), minmax(0,1fr)); gap: 4px; padding: 7px; }
.choices-label { grid-column: 1 / -1; font-size: 11px; font-weight: 650; }
.choices button {
  min-height: 34px; padding: 5px 2px; border: 1px solid var(--app-rule); border-radius: 6px;
  color: var(--app-ink); background: var(--app-list); font-size: 11px;
}
.choices button[aria-pressed="true"] { border-color: var(--app-accent); color: var(--app-accent); font-weight: 650; }
.file-rows .dark-list-row { min-height: 43px; }
.file-preview { padding: 16px 14px; }
.file-preview h2 { margin-bottom: 13px; font-size: 21px; line-height: 1.2; }
.file-preview p, .file-preview li { font-size: 13px; line-height: 1.65; }
.file-preview ul { padding-left: 19px; }
.preview-code {
  display: block; padding: 10px; margin-top: 12px; border: 1px solid var(--app-rule);
  border-radius: 7px; color: var(--app-ink); background: var(--app-group); font-size: 11px;
}
.file-path { padding: 7px 13px; color: var(--app-muted); font-size: 11px; }
.project-row { margin-bottom: 14px; }
.indicator { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #87a0bb; }
.indicator[data-state="wait"] { background: #ecc47b; }
.indicator[data-state="run"] { background: #76b5ff; }
.indicator[data-state="done"] { background: #87c49e; }
.indicator[data-state="error"] { background: #ea9598; }
.list-view .filters { padding: 7px 10px 0; }
.list-view .filters button { white-space: nowrap; }
.file-menu { width: 100%; background: #f2f6ef; }
.agent-options .setting { font-size: 13px; }
.agent-options .setting[aria-pressed="true"] { color: var(--app-accent); }

@media (max-width: 990px) {
  .page { width: calc(100% - 34px); }
  .gallery { grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 22px; }
  .doc-nav { gap: 14px; }
}
@media (max-width: 660px) {

  .doc-nav { gap: 16px; overflow-x: auto; white-space: nowrap; padding-block: 7px; scrollbar-width: none; }
  .doc-nav a { display: grid; place-items: center; min-height: 30px; }
  .gallery { grid-template-columns: minmax(0,1fr); padding-block: 15px 35px; row-gap: 28px; }
  .preview { scroll-margin-top: 106px; }
  .preview figcaption { margin-bottom: 7px; }
  .phone { height: min(638px, 167vw); border-width: 6px; border-radius: 43px; }
}

            <section class="sheet file-menu" role="dialog" aria-modal="true" aria-label="文件操作">
              <h3 data-part="share-filename">README.md</h3>
              <button type="button" data-close-sheet>存储到「文件」</button>

  </template>

  <script>
    const views = [
      ['chat', '对话'],
      ['bark', '通知设置'],
      ['lock', '锁屏通知'],
      ['more', '更多 · 设置'],
      ['sessions', '会话'],
      ['projects', '项目与文件'],
      ['nodes', '我的节点'],
      ['file', '文件预览'],
      ['login', '登录'],
      ['agent', 'Agent 配置'],
    ];
    const sessions = {
      reconnect: ['检查会话恢复', '检查断线后会话能不能恢复，跑一下回归。', '已定位到重连测试。准备在当前项目里运行用例。', '等待你确认'],
      relay: ['检查 Relay 资源路径', '看一下远程页面的静态资源从哪里加载。', '正在读取 Relay 返回的页面和资源路径。', '正在检查资源'],
      docs: ['更新独立后台文档', '把 Windows 安装注意事项补到文档里。', '已补充安装和升级步骤。', '已完成'],
      windows: ['验证 Windows 安装包', '运行 Windows 安装包验证。', '验证中止，当前环境缺少 Windows PowerShell 5.1。', '验证失败'],
    };
    const board = document.getElementById('preview-board');
    const navigation = document.getElementById('preview-nav');
    const phoneTemplate = document.getElementById('phone-template');
    const tabTemplate = document.getElementById('phone-tabs');

    function setupPhone(phone, startView) {
      const part = name => phone.querySelector('[data-part="' + name + '"]');
      const phoneBody = part('phone-body');
      const draft = part('draft');
      const views = [...phone.querySelectorAll('[data-screen]')];
      let currentView = startView;
      let theme = 'dark';
      let decision = '';
      let session = 'reconnect';
      let attachment = '';
      let openSheet = null;
      let sheetTrigger = null;
      let edgeStart = null;

      for (const view of phone.querySelectorAll('[data-tabbar]')) {
        const tabs = tabTemplate.content.cloneNode(true);
        tabs.querySelector('[data-go="' + view.dataset.screen + '"]').setAttribute('aria-current', 'page');
        view.append(tabs);
      }

      function showView(name) {
        if (openSheet) hideSheet(false);
        currentView = name;
        for (const view of views) view.hidden = view.dataset.screen !== name;
        const accountPage = ['nodes', 'login', 'offline'].includes(name);
        phone.dataset.tone = name === 'lock' ? 'lock' : accountPage ? 'light' : name === 'chat' ? 'dark' : theme;
        part('status-time').style.visibility = name === 'lock' ? 'hidden' : 'visible';
      }

      function showConversation(key) {
        session = key;
        const [title, question, reply, status] = sessions[key];
        part('chat-session-title').textContent = title;
        part('user-message').textContent = question;
        part('agent-message').textContent = reply;
        part('approval').hidden = key !== 'reconnect' || Boolean(decision);
        part('approval-result').hidden = key !== 'reconnect' || !decision;
        part('approval-result').textContent = decision ? '已提交 · ' + decision : '';
        part('chat-activity').textContent = key === 'reconnect' && decision ? '已处理审批' : status;
        showView('chat');
      }

      function selectOption(button, attribute) {
        const group = button.closest('.choices, .settings-rows');
        for (const item of group.querySelectorAll('[' + attribute + ']')) {
          item.setAttribute('aria-pressed', String(item === button));
        }
      }

      function setAttachment(name) {
        attachment = name;
        part('attachment-name').textContent = name;
        part('attachment').hidden = !name;
        part('send-message').disabled = !draft.value.trim() && !name;
      }

      function showSheet(name, trigger) {
        openSheet = part(name);
        sheetTrigger = trigger;
        phoneBody.inert = true;
        openSheet.hidden = false;
        openSheet.querySelector('.sheet button').focus({ preventScroll: true });
      }

      function hideSheet(restoreFocus = true) {
        openSheet.hidden = true;
        openSheet = null;
        phoneBody.inert = false;
        if (restoreFocus) sheetTrigger.focus({ preventScroll: true });
      }

      phone.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        const { go, approve, session: nextSession, theme: nextTheme, filter } = button.dataset;
        if (go) {
          if (go === 'chat') showConversation(session);
          else showView(go);
        } else if (nextSession) {
          showConversation(nextSession);
        } else if (approve) {
          decision = approve;
          showConversation(session);
        } else if (filter) {
          selectOption(button, 'data-filter');
          for (const row of phone.querySelectorAll('[data-session]')) row.hidden = filter !== 'all' && row.dataset.state !== filter;
        } else if (nextTheme) {
          selectOption(button, 'data-theme');
          theme = nextTheme === 'system' ? 'dark' : nextTheme;
          showView(currentView);
        } else if (button.hasAttribute('data-choice')) {
          selectOption(button, 'data-choice');
        } else if (button.getAttribute('role') === 'switch') {
          button.setAttribute('aria-checked', String(button.getAttribute('aria-checked') !== 'true'));
        } else if (button.hasAttribute('data-attachment')) {
          setAttachment(button.dataset.attachment);
          hideSheet();
        } else if (button.hasAttribute('data-close-sheet')) {
          hideSheet();
        } else {
          switch (button.dataset.part) {
            case 'open-notification':
              if (button.dataset.test === 'true') showView('bark');
              else showConversation('reconnect');
              break;
            case 'test-notice':
              part('open-notification').dataset.test = 'true';
              part('notification-title').textContent = '测试通知';
              part('notification-summary').textContent = '通知已开启';
              showView('lock');
              break;
            case 'refresh-nodes': part('node-refresh-status').textContent = '刚刚更新'; break;
            case 'add-attachment': showSheet('attachment-sheet', button); break;
            case 'remove-attachment': setAttachment(''); break;
            case 'share': showSheet('share-sheet', button); break;
          }
        }
      });
      phone.addEventListener('keydown', event => {
        if (event.key === 'Escape' && openSheet) hideSheet();
      });
      part('login-form').addEventListener('submit', event => {
        event.preventDefault();
        showView('nodes');
      });
      draft.addEventListener('input', () => setAttachment(attachment));
      part('composer').addEventListener('submit', event => {
        event.preventDefault();
        if (!draft.value.trim() && !attachment) return;
        const bubble = document.createElement('p');
        bubble.className = 'user-bubble';
        bubble.textContent = [draft.value.trim(), attachment].filter(Boolean).join(' · ');
        part('added-messages').append(bubble);
        draft.value = '';
        setAttachment('');
        part('thread').scrollTop = part('thread').scrollHeight;
      });
      phoneBody.addEventListener('touchstart', event => {
        const touch = event.touches[0];
        edgeStart = touch.clientX - phoneBody.getBoundingClientRect().left <= 20 ? { x: touch.clientX, y: touch.clientY } : null;
      }, { passive: true });
      phoneBody.addEventListener('touchend', event => {
        if (!edgeStart) return;
        const touch = event.changedTouches[0];
        const back = { offline: 'nodes', chat: 'sessions', sessions: 'nodes', projects: 'nodes', file: 'projects', bark: 'more', agent: 'more' }[currentView];
        if (back && touch.clientX - edgeStart.x > 68 && Math.abs(touch.clientY - edgeStart.y) < 42) showView(back);
        edgeStart = null;
      }, { passive: true });

      showView(startView);
    }

    for (const [view, title] of views) {
      const link = document.createElement('a');
      link.href = '#' + view;
      link.textContent = title;
      navigation.append(link);

      const preview = document.createElement('figure');
      preview.className = 'preview';
      preview.id = view;
      const caption = document.createElement('figcaption');
      caption.textContent = title;
      preview.append(caption, phoneTemplate.content.cloneNode(true));
      board.append(preview);
      setupPhone(preview.querySelector('.phone'), view);
    }
  </script>

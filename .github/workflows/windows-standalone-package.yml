name: Windows standalone package
on:
  workflow_dispatch:
    inputs:
      standalone_version:
        description: Standalone version whose draft release holds the packages
        required: true
      candidate_release:
        description: Draft release tag when replacing an existing public version
        required: false
      verify_self_update:
        description: Verify the browser-triggered update using the final package
        type: boolean
        default: false
  push:
    branches: ['standalone-*']
    paths:
      - 'scripts/standalone/install.ps1'
      - 'scripts/standalone/verify-windows-standalone-package.ps1'
      - '.github/workflows/windows-standalone-package.yml'
permissions:
  # GitHub only exposes draft releases to identities with repository push access.
  contents: write
jobs:
  windows-powershell-5-1:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.standalone_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact candidate package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE: ${{ inputs.candidate_release }}
        run: |
          $version = $env:VERSION -replace '^standalone-', ''
          $out = Join-Path $PWD 'candidate'
          New-Item -ItemType Directory -Path $out | Out-Null
          $name = "local-ai-agent-$version-windows-amd64.zip"
          $release = if ($env:CANDIDATE_RELEASE) { $env:CANDIDATE_RELEASE } else { "standalone-v$version" }
          gh release download $release --repo $env:GITHUB_REPOSITORY --dir $out --pattern $name --pattern "$name.sha256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = ((Get-Content -LiteralPath (Join-Path $out "$name.sha256") -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out $name)).Hash
          if ($expected -ine $actual) { throw "SHA-256 mismatch for $name" }
          "ZIP=$(Join-Path $out $name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify the package installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./scripts/standalone/verify-windows-standalone-package.ps1 -Zip $env:ZIP -Version $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-go@v5
        if: ${{ inputs.verify_self_update }}
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Verify the scheduled self-update with Windows PowerShell 5.1
        if: ${{ inputs.verify_self_update }}
        shell: powershell
        run: |
          & ./scripts/standalone/verify-windows-self-update.ps1 -Zip $env:ZIP -Version $env:PACKAGE_VERSION
  linux-systemd-self-update:
    if: ${{ inputs.verify_self_update }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.standalone_version }}
      CANDIDATE_RELEASE: ${{ inputs.candidate_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Verify the final Linux package through systemd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=${CANDIDATE_RELEASE:-standalone-v$VERSION}
          archive=local-ai-agent-$VERSION-linux-amd64.tar.gz
          gh release download "$release" --dir "$RUNNER_TEMP" --pattern "$archive" --pattern "$archive.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$archive.sha256")
          (cd runtime && go build -trimpath -ldflags="-X main.version=$VERSION-standalone.1" -o "$RUNNER_TEMP/old-agent" ./server/cmd/mindfs-server)
          sudo python3 scripts/standalone/verify-linux-self-update.py "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/old-agent" "$VERSION"
